<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人云端导航页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.08) 0px, transparent 50%);
        }

        /* Header */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
        }

        /* Search Section */
        .search-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .search-engine-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .engine-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .engine-tab.active {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .search-box-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 4px;
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--primary);
        }

        .search-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            padding: 14px 20px;
            font-size: 1.1rem;
        }

        .search-box-wrapper button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .search-box-wrapper button:hover {
            background: #4f46e5;
        }

        /* Main Grid */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-controls-bar {
            margin-bottom: 24px;
            display: none; /* Show only when logged in */
            gap: 12px;
            justify-content: flex-end;
        }

        .category-section {
            margin-bottom: 48px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .category-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-actions {
            display: none; /* Show only when logged in */
            gap: 8px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Bookmark Card */
        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-glow));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .link-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }

        .link-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .link-info {
            min-width: 0;
        }

        .link-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .link-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 10px;
        }

        .link-actions {
            display: none; /* Show only when logged in */
            gap: 10px;
        }

        .action-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .action-icon:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .action-icon.delete:hover {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            padding: 32px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1f2937;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 24px;
            color: var(--text-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">My Space.</div>
        <div>
            <button id="admin-login-btn" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>管理面板</span>
            </button>
            <button id="admin-logout-btn" class="btn" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span>退出登录</span>
            </button>
        </div>
    </header>

    <!-- Search Engine Interface -->
    <div class="search-container">
        <div class="search-engine-selector">
            <button class="engine-tab active" data-engine="google">Google</button>
            <button class="engine-tab" data-engine="baidu">百度</button>
            <button class="engine-tab" data-engine="github">GitHub</button>
        </div>
        <div class="search-box-wrapper">
            <input type="text" id="web-search-input" placeholder="在网络上进行搜索或输入内容过滤...">
            <button id="web-search-btn">搜索</button>
        </div>
    </div>

    <!-- Main Content Links -->
    <main>
        <div class="admin-controls-bar" id="admin-bar">
            <button id="add-category-btn" class="btn btn-primary">
                <span>添加分类</span>
            </button>
            <button id="add-link-btn" class="btn btn-primary">
                <span>添加链接</span>
            </button>
        </div>

        <div id="nav-content">
            <!-- Loaded dynamically from API -->
            <div class="empty-state">正在加载导航链接...</div>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('login-modal')">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title">管理员身份验证</h3>
            </div>
            <div class="form-group">
                <label for="admin-password">管理员密码</label>
                <input type="password" id="admin-password" class="form-control" placeholder="请输入管理密码">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('login-modal')">取消</button>
                <button class="btn btn-primary" id="submit-login-btn">确认登录</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('category-modal')">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title" id="cat-modal-title">添加分类</h3>
            </div>
            <div class="form-group">
                <label for="cat-name">分类名称</label>
                <input type="text" id="cat-name" class="form-control" placeholder="例如: 社交网络, 开发工具">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('category-modal')">取消</button>
                <button class="btn btn-primary" id="save-cat-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- Link Modal -->
    <div id="link-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('link-modal')">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title" id="link-modal-title">添加链接</h3>
            </div>
            <input type="hidden" id="link-id">
            <div class="form-group">
                <label for="link-cat-select">所属分类</label>
                <select id="link-cat-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label for="link-title-input">链接标题</label>
                <input type="text" id="link-title-input" class="form-control" placeholder="名称">
            </div>
            <div class="form-group">
                <label for="link-url">跳转地址</label>
                <input type="url" id="link-url" class="form-control" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="link-desc-input">链接描述</label>
                <input type="text" id="link-desc-input" class="form-control" placeholder="简短的一句话描述">
            </div>
            <div class="form-group">
                <label for="link-icon">图标 Emoji 或图片 URL</label>
                <input type="text" id="link-icon" class="form-control" placeholder="🎈 或 https://example.com/logo.png">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('link-modal')">取消</button>
                <button class="btn btn-primary" id="save-link-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast message -->
    <div id="toast" class="toast">操作成功</div>

    <script>
        // Global State
        let categories = [];
        let links = [];
        let currentSearchEngine = 'google';
        let isAdmin = false;
        let adminToken = '';

        const engines = {
            google: 'https://www.google.com/search?q=',
            baidu: 'https://www.baidu.com/s?wd=',
            github: 'https://github.com/search?q='
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadNavData();
            checkAdminSession();
            setupEventListeners();
        });

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = isError ? 'var(--accent-red)' : 'var(--card-border)';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function openModal(id) {
            document.getElementById(id).classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function checkAdminSession() {
            const token = localStorage.getItem('admin_token');
            if (token) {
                isAdmin = true;
                adminToken = token;
                updateAdminUI();
            }
        }

        function updateAdminUI() {
            const loginBtn = document.getElementById('admin-login-btn');
            const logoutBtn = document.getElementById('admin-logout-btn');
            const adminBar = document.getElementById('admin-bar');
            
            if (isAdmin) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-flex';
                adminBar.style.display = 'flex';
                document.querySelectorAll('.category-actions').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('.link-actions').forEach(el => el.style.display = 'flex');
            } else {
                loginBtn.style.display = 'inline-flex';
                logoutBtn.style.display = 'none';
                adminBar.style.display = 'none';
                document.querySelectorAll('.category-actions').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.link-actions').forEach(el => el.style.display = 'none');
            }
        }

        async function loadNavData() {
            try {
                const res = await fetch('/api/links');
                const data = await res.json();
                categories = data.categories || [];
                links = data.links || [];
                renderNav();
            } catch (err) {
                console.error(err);
                document.getElementById('nav-content').innerHTML = `
                    <div class="empty-state" style="color: var(--accent-red);">
                        获取导航数据失败，请确认 D1 数据库配置正常。
                    </div>
                `;
            }
        }

        function renderNav(filterQuery = '') {
            const container = document.getElementById('nav-content');
            if (categories.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无分类，请登录后添加。</div>';
                return;
            }

            let html = '';
            categories.forEach(cat => {
                const catLinks = links.filter(l => l.category_id === cat.category_id && 
                    (filterQuery === '' || 
                     l.title.toLowerCase().includes(filterQuery.toLowerCase()) || 
                     l.description.toLowerCase().includes(filterQuery.toLowerCase())
                    )
                );

                if (filterQuery !== '' && catLinks.length === 0) return; // Skip categories that don't match query

                html += `
                    <div class="category-section" id="cat-sec-${cat.category_id}">
                        <div class="category-header">
                            <h2 class="category-title">
                                <span>📁</span>
                                <span>${cat.name}</span>
                            </h2>
                            <div class="category-actions" style="${isAdmin ? 'display: flex;' : 'display: none;'}">
                                <button class="action-icon delete" onclick="deleteCategory(${cat.category_id})" title="删除分类">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="links-grid">
                `;

                if (catLinks.length === 0) {
                    html += `<div class="empty-state">该分类下暂无链接。</div>`;
                } else {
                    catLinks.forEach(link => {
                        const iconHtml = link.icon_url && (link.icon_url.startsWith('http') || link.icon_url.startsWith('/') || link.icon_url.length > 2)
                            ? `<img class="link-icon" src="${link.icon_url}" alt="" onerror="this.outerHTML='🔗'">`
                            : `<div class="link-icon">${link.icon_url || '🔗'}</div>`;

                        html += `
                            <div class="link-card-container">
                                <a href="${link.url}" target="_blank" class="link-card" data-title="${link.title}">
                                    <div>
                                        <div class="link-header">
                                            ${iconHtml}
                                            <div class="link-info">
                                                <h4 class="link-title">${link.title}</h4>
                                                <p class="link-desc">${link.description || ''}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="link-footer" style="${isAdmin ? 'display: flex;' : 'display: none;'}">
                                        <div class="link-actions">
                                            <button class="action-icon" onclick="event.preventDefault(); editLink(${link.link_id})" title="修改">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>
                                            </button>
                                            <button class="action-icon delete" onclick="event.preventDefault(); deleteLink(${link.link_id})" title="删除">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        `;
                    });
                }

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div class="empty-state">未找到匹配的链接记录。</div>';
        }

        function setupEventListeners() {
            // Search engine tabs
            document.querySelectorAll('.engine-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentSearchEngine = tab.dataset.engine;
                });
            });

            // Web Search
            const searchInput = document.getElementById('web-search-input');
            const searchBtn = document.getElementById('web-search-btn');
            
            const performSearch = () => {
                const query = searchInput.value.trim();
                if (query) {
                    window.open(engines[currentSearchEngine] + encodeURIComponent(query), '_blank');
                }
            };

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });

            // Real-time page filtering
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                renderNav(val);
            });

            // Auth events
            document.getElementById('admin-login-btn').addEventListener('click', () => {
                document.getElementById('admin-password').value = '';
                openModal('login-modal');
            });

            document.getElementById('admin-logout-btn').addEventListener('click', () => {
                isAdmin = false;
                adminToken = '';
                localStorage.removeItem('admin_token');
                updateAdminUI();
                showToast('已安全退出管理模式');
            });

            document.getElementById('submit-login-btn').addEventListener('click', submitLogin);
            document.getElementById('admin-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitLogin();
            });

            // Category actions
            document.getElementById('add-category-btn').addEventListener('click', () => {
                document.getElementById('cat-name').value = '';
                openModal('category-modal');
            });

            document.getElementById('save-cat-btn').addEventListener('click', saveCategory);

            // Link actions
            document.getElementById('add-link-btn').addEventListener('click', () => {
                document.getElementById('link-id').value = '';
                document.getElementById('link-title-input').value = '';
                document.getElementById('link-url').value = '';
                document.getElementById('link-desc-input').value = '';
                document.getElementById('link-icon').value = '';
                document.getElementById('link-modal-title').textContent = '添加链接';
                
                // Load category dropdown
                const select = document.getElementById('link-cat-select');
                select.innerHTML = categories.map(cat => `<option value="${cat.category_id}">${cat.name}</option>`).join('');
                
                openModal('link-modal');
            });

            document.getElementById('save-link-btn').addEventListener('click', saveLink);
        }

        async function submitLogin() {
            const password = document.getElementById('admin-password').value;
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    isAdmin = true;
                    adminToken = data.token;
                    localStorage.setItem('admin_token', adminToken);
                    closeModal('login-modal');
                    updateAdminUI();
                    showToast('登录成功，已开启管理模式');
                } else {
                    showToast(data.error || '登录失败', true);
                }
            } catch (err) {
                showToast('与后端服务器通信异常', true);
            }
        }

        async function saveCategory() {
            const name = document.getElementById('cat-name').value.trim();
            if (!name) return showToast('分类名称不能为空', true);

            try {
                const res = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    closeModal('category-modal');
                    showToast('分类创建成功');
                    loadNavData();
                } else {
                    showToast('保存分类失败，请重试', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('确认删除该分类？这将同时删除其下属的所有链接。')) return;

            try {
                const res = await fetch('/api/categories', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ category_id: id })
                });

                if (res.ok) {
                    showToast('分类删除成功');
                    loadNavData();
                } else {
                    showToast('删除失败', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }

        async function saveLink() {
            const link_id = document.getElementById('link-id').value;
            const category_id = parseInt(document.getElementById('link-cat-select').value);
            const title = document.getElementById('link-title-input').value.trim();
            const url = document.getElementById('link-url').value.trim();
            const description = document.getElementById('link-desc-input').value.trim();
            const icon_url = document.getElementById('link-icon').value.trim();

            if (!title || !url) return showToast('标题和地址为必填项', true);

            const method = link_id ? 'PUT' : 'POST';
            const payload = { category_id, title, url, description, icon_url };
            if (link_id) payload.link_id = parseInt(link_id);

            try {
                const res = await fetch('/api/links', {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal('link-modal');
                    showToast(link_id ? '链接修改成功' : '链接添加成功');
                    loadNavData();
                } else {
                    showToast('保存链接失败，请重试', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }

        function editLink(id) {
            const link = links.find(l => l.link_id === id);
            if (!link) return;

            document.getElementById('link-id').value = link.link_id;
            document.getElementById('link-title-input').value = link.title;
            document.getElementById('link-url').value = link.url;
            document.getElementById('link-desc-input').value = link.description || '';
            document.getElementById('link-icon').value = link.icon_url || '';
            document.getElementById('link-modal-title').textContent = '修改链接';

            const select = document.getElementById('link-cat-select');
            select.innerHTML = categories.map(cat => `<option value="${cat.category_id}" ${cat.category_id === link.category_id ? 'selected' : ''}>${cat.name}</option>`).join('');

            openModal('link-modal');
        }

        async function deleteLink(id) {
            if (!confirm('确认删除该链接？')) return;

            try {
                const res = await fetch('/api/links', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ link_id: id })
                });

                if (res.ok) {
                    showToast('链接删除成功');
                    loadNavData();
                } else {
                    showToast('删除失败', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人云端导航页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6fa;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary: #1a73e8; /* Google Blue as main primary */
            --primary-glow: rgba(26, 115, 232, 0.15);
            
            /* Glassmorphism settings */
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.7);
            
            --accent-green: #34a853;
            --accent-red: #ea4335;
            
            /* Google Colors & Backgrounds */
            --google-blue: #4285f4;
            --google-blue-bg: rgba(66, 133, 244, 0.08);
            --google-blue-glow: rgba(66, 133, 244, 0.15);
            
            --google-red: #ea4335;
            --google-red-bg: rgba(234, 67, 53, 0.08);
            --google-red-glow: rgba(234, 67, 53, 0.15);
            
            --google-yellow: #fbbc05;
            --google-yellow-bg: rgba(251, 188, 5, 0.08);
            --google-yellow-glow: rgba(251, 188, 5, 0.15);
            
            --google-green: #34a853;
            --google-green-bg: rgba(52, 168, 83, 0.08);
            --google-green-glow: rgba(52, 168, 83, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(66, 133, 244, 0.1) 0px, transparent 40%),
                radial-gradient(at 100% 0%, rgba(234, 67, 53, 0.08) 0px, transparent 45%),
                radial-gradient(at 100% 100%, rgba(251, 188, 5, 0.06) 0px, transparent 45%),
                radial-gradient(at 0% 100%, rgba(52, 168, 83, 0.08) 0px, transparent 40%);
            background-attachment: fixed;
        }

        /* Header */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--google-blue), var(--google-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #1557b0;
            border-color: #1557b0;
            box-shadow: 0 6px 16px rgba(26, 115, 232, 0.25);
        }

        /* Main Grid */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-controls-bar {
            margin-bottom: 32px;
            display: none; /* Show only when logged in */
            gap: 12px;
            justify-content: flex-end;
        }

        .category-section {
            margin-bottom: 48px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 12px;
        }

        .category-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-actions {
            display: none; /* Show only when logged in */
            gap: 8px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 24px;
        }

        /* Bookmark Card - Square & Glassmorphism */
        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.04);
        }

        .link-card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .link-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            flex-shrink: 0;
            object-fit: cover;
        }

        .link-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.3;
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }

        /* Hover Transitions & Scale */
        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .link-card:hover .link-icon {
            transform: scale(1.1);
        }

        /* Google Color Hover Effects */
        .card-google-blue .link-icon {
            background: var(--google-blue-bg);
            color: var(--google-blue);
        }
        .card-google-blue:hover {
            border-color: rgba(66, 133, 244, 0.4);
            box-shadow: 0 12px 28px var(--google-blue-glow);
        }

        .card-google-red .link-icon {
            background: var(--google-red-bg);
            color: var(--google-red);
        }
        .card-google-red:hover {
            border-color: rgba(234, 67, 53, 0.4);
            box-shadow: 0 12px 28px var(--google-red-glow);
        }

        .card-google-yellow .link-icon {
            background: var(--google-yellow-bg);
            color: var(--google-yellow);
        }
        .card-google-yellow:hover {
            border-color: rgba(251, 188, 5, 0.4);
            box-shadow: 0 12px 28px var(--google-yellow-glow);
        }

        .card-google-green .link-icon {
            background: var(--google-green-bg);
            color: var(--google-green);
        }
        .card-google-green:hover {
            border-color: rgba(52, 168, 83, 0.4);
            box-shadow: 0 12px 28px var(--google-green-glow);
        }

        /* Action buttons for admin overlay */
        .link-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none; /* Controlled by render and visibility */
            gap: 6px;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 10;
        }

        .link-card:hover .link-actions {
            opacity: 1;
        }

        .action-icon {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .action-icon:hover {
            color: var(--text-color);
            background: #ffffff;
            transform: scale(1.05);
        }

        .action-icon.delete:hover {
            color: white;
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Glassmorphic Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.25);
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            width: 90%;
            max-width: 480px;
            padding: 32px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 64px rgba(31, 38, 135, 0.08);
            color: #1e293b;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }

        /* Glassmorphic Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 14px 28px;
            color: var(--text-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 500;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">My Space.</div>
        <div>
            <button id="admin-login-btn" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>管理面板</span>
            </button>
            <button id="admin-logout-btn" class="btn" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span>退出登录</span>
            </button>
        </div>
    </header>



    <!-- Main Content Links -->
    <main>
        <div class="admin-controls-bar" id="admin-bar">
            <button id="add-category-btn" class="btn btn-primary">
                <span>添加分类</span>
            </button>
            <button id="add-link-btn" class="btn btn-primary">
                <span>添加链接</span>
            </button>
        </div>

        <div id="nav-content">
            <!-- Loaded dynamically from API -->
            <div class="empty-state">正在加载导航链接...</div>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('login-modal')">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title">管理员身份验证</h3>
            </div>
            <div class="form-group">
                <label for="admin-password">管理员密码</label>
                <input type="password" id="admin-password" class="form-control" placeholder="请输入管理密码">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('login-modal')">取消</button>
                <button class="btn btn-primary" id="submit-login-btn">确认登录</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('category-modal')">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title" id="cat-modal-title">添加分类</h3>
            </div>
            <div class="form-group">
                <label for="cat-name">分类名称</label>
                <input type="text" id="cat-name" class="form-control" placeholder="例如: 社交网络, 开发工具">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('category-modal')">取消</button>
                <button class="btn btn-primary" id="save-cat-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- Link Modal -->
    <div id="link-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('link-modal')">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title" id="link-modal-title">添加链接</h3>
            </div>
            <input type="hidden" id="link-id">
            <div class="form-group">
                <label for="link-cat-select">所属分类</label>
                <select id="link-cat-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label for="link-title-input">链接标题</label>
                <input type="text" id="link-title-input" class="form-control" placeholder="名称">
            </div>
            <div class="form-group">
                <label for="link-url">跳转地址</label>
                <input type="url" id="link-url" class="form-control" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="link-desc-input">链接描述</label>
                <input type="text" id="link-desc-input" class="form-control" placeholder="简短的一句话描述">
            </div>
            <div class="form-group">
                <label for="link-icon">图标 Emoji 或图片 URL</label>
                <input type="text" id="link-icon" class="form-control" placeholder="🎈 或 https://example.com/logo.png">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('link-modal')">取消</button>
                <button class="btn btn-primary" id="save-link-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast message -->
    <div id="toast" class="toast">操作成功</div>

    <script>
        // Global State
        let categories = [];
        let links = [];
        let isAdmin = false;
        let adminToken = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadNavData();
            checkAdminSession();
            setupEventListeners();
        });

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = isError ? 'var(--accent-red)' : 'var(--card-border)';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function openModal(id) {
            document.getElementById(id).classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function checkAdminSession() {
            const token = localStorage.getItem('admin_token');
            if (token) {
                isAdmin = true;
                adminToken = token;
                updateAdminUI();
            }
        }

        function updateAdminUI() {
            const loginBtn = document.getElementById('admin-login-btn');
            const logoutBtn = document.getElementById('admin-logout-btn');
            const adminBar = document.getElementById('admin-bar');
            
            if (isAdmin) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-flex';
                adminBar.style.display = 'flex';
                document.querySelectorAll('.category-actions').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('.link-actions').forEach(el => el.style.display = 'flex');
            } else {
                loginBtn.style.display = 'inline-flex';
                logoutBtn.style.display = 'none';
                adminBar.style.display = 'none';
                document.querySelectorAll('.category-actions').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.link-actions').forEach(el => el.style.display = 'none');
            }
        }

        async function loadNavData() {
            try {
                const res = await fetch('/api/links');
                const data = await res.json();
                categories = data.categories || [];
                links = data.links || [];
                renderNav();
            } catch (err) {
                console.error(err);
                document.getElementById('nav-content').innerHTML = `
                    <div class="empty-state" style="color: var(--accent-red);">
                        获取导航数据失败，请确认 D1 数据库配置正常。
                    </div>
                `;
            }
        }

        function renderNav() {
            const container = document.getElementById('nav-content');
            if (categories.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无分类，请登录后添加。</div>';
                return;
            }

            const googleColors = ['blue', 'red', 'yellow', 'green'];
            let html = '';
            categories.forEach(cat => {
                const catLinks = links.filter(l => l.category_id === cat.category_id);

                html += `
                    <div class="category-section" id="cat-sec-${cat.category_id}">
                        <div class="category-header">
                            <h2 class="category-title">
                                <span>📁</span>
                                <span>${cat.name}</span>
                            </h2>
                            <div class="category-actions" style="${isAdmin ? 'display: flex;' : 'display: none;'}">
                                <button class="action-icon delete" onclick="deleteCategory(${cat.category_id})" title="删除分类">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="links-grid">
                `;

                if (catLinks.length === 0) {
                    html += `<div class="empty-state">该分类下暂无链接。</div>`;
                } else {
                    catLinks.forEach((link, index) => {
                        const color = googleColors[index % 4];
                        const iconHtml = link.icon_url && (link.icon_url.startsWith('http') || link.icon_url.startsWith('/') || link.icon_url.length > 2)
                            ? `<img class="link-icon" src="${link.icon_url}" alt="" onerror="this.outerHTML='🔗'">`
                            : `<div class="link-icon">${link.icon_url || '🔗'}</div>`;

                        html += `
                            <div class="link-card-container">
                                <a href="${link.url}" target="_blank" class="link-card card-google-${color}" data-title="${link.title}">
                                    <div class="link-card-content">
                                        ${iconHtml}
                                        <h4 class="link-title">${link.title}</h4>
                                        <p class="link-desc">${link.description || ''}</p>
                                    </div>
                                    <div class="link-actions" style="${isAdmin ? 'display: flex;' : 'display: none;'}">
                                        <button class="action-icon" onclick="event.preventDefault(); editLink(${link.link_id})" title="修改">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>
                                        </button>
                                        <button class="action-icon delete" onclick="event.preventDefault(); deleteLink(${link.link_id})" title="删除">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                        </button>
                                    </div>
                                </a>
                            </div>
                        `;
                    });
                }

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div class="empty-state">未找到匹配的链接记录。</div>';
        }

        function setupEventListeners() {
            // Auth events
            document.getElementById('admin-login-btn').addEventListener('click', () => {
                document.getElementById('admin-password').value = '';
                openModal('login-modal');
            });

            document.getElementById('admin-logout-btn').addEventListener('click', () => {
                isAdmin = false;
                adminToken = '';
                localStorage.removeItem('admin_token');
                updateAdminUI();
                showToast('已安全退出管理模式');
            });

            document.getElementById('submit-login-btn').addEventListener('click', submitLogin);
            document.getElementById('admin-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitLogin();
            });

            // Category actions
            document.getElementById('add-category-btn').addEventListener('click', () => {
                document.getElementById('cat-name').value = '';
                openModal('category-modal');
            });

            document.getElementById('save-cat-btn').addEventListener('click', saveCategory);

            // Link actions
            document.getElementById('add-link-btn').addEventListener('click', () => {
                document.getElementById('link-id').value = '';
                document.getElementById('link-title-input').value = '';
                document.getElementById('link-url').value = '';
                document.getElementById('link-desc-input').value = '';
                document.getElementById('link-icon').value = '';
                document.getElementById('link-modal-title').textContent = '添加链接';
                
                // Load category dropdown
                const select = document.getElementById('link-cat-select');
                select.innerHTML = categories.map(cat => `<option value="${cat.category_id}">${cat.name}</option>`).join('');
                
                openModal('link-modal');
            });

            document.getElementById('save-link-btn').addEventListener('click', saveLink);
        }

        async function submitLogin() {
            const password = document.getElementById('admin-password').value;
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    isAdmin = true;
                    adminToken = data.token;
                    localStorage.setItem('admin_token', adminToken);
                    closeModal('login-modal');
                    updateAdminUI();
                    showToast('登录成功，已开启管理模式');
                } else {
                    showToast(data.error || '登录失败', true);
                }
            } catch (err) {
                showToast('与后端服务器通信异常', true);
            }
        }

        async function saveCategory() {
            const name = document.getElementById('cat-name').value.trim();
            if (!name) return showToast('分类名称不能为空', true);

            try {
                const res = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    closeModal('category-modal');
                    showToast('分类创建成功');
                    loadNavData();
                } else {
                    showToast('保存分类失败，请重试', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('确认删除该分类？这将同时删除其下属的所有链接。')) return;

            try {
                const res = await fetch('/api/categories', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ category_id: id })
                });

                if (res.ok) {
                    showToast('分类删除成功');
                    loadNavData();
                } else {
                    showToast('删除失败', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }

        async function saveLink() {
            const link_id = document.getElementById('link-id').value;
            const category_id = parseInt(document.getElementById('link-cat-select').value);
            const title = document.getElementById('link-title-input').value.trim();
            const url = document.getElementById('link-url').value.trim();
            const description = document.getElementById('link-desc-input').value.trim();
            const icon_url = document.getElementById('link-icon').value.trim();

            if (!title || !url) return showToast('标题和地址为必填项', true);

            const method = link_id ? 'PUT' : 'POST';
            const payload = { category_id, title, url, description, icon_url };
            if (link_id) payload.link_id = parseInt(link_id);

            try {
                const res = await fetch('/api/links', {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal('link-modal');
                    showToast(link_id ? '链接修改成功' : '链接添加成功');
                    loadNavData();
                } else {
                    showToast('保存链接失败，请重试', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }

        function editLink(id) {
            const link = links.find(l => l.link_id === id);
            if (!link) return;

            document.getElementById('link-id').value = link.link_id;
            document.getElementById('link-title-input').value = link.title;
            document.getElementById('link-url').value = link.url;
            document.getElementById('link-desc-input').value = link.description || '';
            document.getElementById('link-icon').value = link.icon_url || '';
            document.getElementById('link-modal-title').textContent = '修改链接';

            const select = document.getElementById('link-cat-select');
            select.innerHTML = categories.map(cat => `<option value="${cat.category_id}" ${cat.category_id === link.category_id ? 'selected' : ''}>${cat.name}</option>`).join('');

            openModal('link-modal');
        }

        async function deleteLink(id) {
            if (!confirm('确认删除该链接？')) return;

            try {
                const res = await fetch('/api/links', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ link_id: id })
                });

                if (res.ok) {
                    showToast('链接删除成功');
                    loadNavData();
                } else {
                    showToast('删除失败', true);
                }
            } catch (err) {
                showToast('网络请求异常', true);
            }
        }
    </script>
</body>
</html>
